[package]
name = "plainleaf"
version = "0.1.0"
edition = "2021"
description = "A quiet Markdown reader and editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
rfd = "0.17"
tempfile = "3"

# Linux has no `RunEvent::Opened`; a second launch's argv (the double-clicked
# file) is routed into the running instance through the single-instance plugin.
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-single-instance = "2"
