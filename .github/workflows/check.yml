name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - run: npm ci
      - run: npm run verify
      - run: npm audit --audit-level=high
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Compile desktop
        run: npm run desktop:build -- --no-bundle
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        run: |
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          curl --fail --location --proto '=https' --tlsv1.2 https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_checksums.txt -o /tmp/checksums.txt
          cd /tmp
          mv gitleaks.tar.gz gitleaks_8.30.0_linux_x64.tar.gz
          grep ' gitleaks_8.30.0_linux_x64.tar.gz$' checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.0_linux_x64.tar.gz gitleaks
      - run: /tmp/gitleaks git --redact --log-opts="--all"
